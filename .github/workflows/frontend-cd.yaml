name: Frontend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'starter/frontend/**'
      - '.github/workflows/frontend-cd.yaml'
  workflow_dispatch:

env:
  REACT_APP_MOVIE_API_URL: ${{ secrets.REACT_APP_MOVIE_API_URL }}

jobs:

  # =========================
  # LINT
  # =========================
  lint:
    name: Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version-file: starter/frontend/.nvmrc
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint


  # =========================
  # TEST
  # =========================
  test:
    name: Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version-file: starter/frontend/.nvmrc
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: CI=true npm test -- --watchAll=false


  # =========================
  # BUILD + PUSH TO ECR
  # =========================
  build:
    name: Build
    runs-on: ubuntu-latest

    needs:
      - lint
      - test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        working-directory: starter/frontend
        run: |
          docker build \
            --build-arg REACT_APP_MOVIE_API_URL="${{ secrets.REACT_APP_MOVIE_API_URL }}" \
            --tag mp-frontend:${{ github.sha }} .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag image
        run: |
          docker tag \
            mp-frontend:${{ github.sha }} \
            ${{ secrets.FRONTEND_ECR_REPO }}:${{ github.sha }}

      - name: Push image to ECR
        run: |
          docker push \
            ${{ secrets.FRONTEND_ECR_REPO }}:${{ github.sha }}


  # =========================
  # DEPLOY TO EKS
  # =========================
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name "${{ secrets.EKS_CLUSTER_NAME }}" \
            --region "${{ secrets.AWS_REGION }}"

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Set frontend image
        working-directory: starter/frontend/k8s
        run: |
          kustomize edit set image \
            frontend=${{ secrets.FRONTEND_ECR_REPO }}:${{ github.sha }}

      - name: Deploy frontend
        working-directory: starter/frontend/k8s
        run: |
          kustomize build | kubectl apply -f -

      # =========================
      # DIAGNOSTICS
      # =========================
      - name: Check frontend deployment
        run: |
          echo "===== DEPLOYMENT ====="
          kubectl get deployment frontend -o wide

          echo ""
          echo "===== PODS ====="
          kubectl get pods -l app=frontend -o wide

          echo ""
          echo "===== REPLICASETS ====="
          kubectl get replicasets -l app=frontend -o wide

          echo ""
          echo "===== SERVICE ====="
          kubectl get service frontend -o wide

      - name: Check frontend rollout
        run: |
          echo "===== ROLLOUT STATUS ====="
          kubectl rollout status deployment/frontend --timeout=60s || true

          echo ""
          echo "===== DEPLOYMENT DESCRIPTION ====="
          kubectl describe deployment frontend

          echo ""
          echo "===== POD DESCRIPTION ====="
          kubectl describe pods -l app=frontend

          echo ""
          echo "===== RECENT EVENTS ====="
          kubectl get events --sort-by=.lastTimestamp | tail -30

      # =========================
      # LOAD BALANCER
      # =========================
      - name: Wait for frontend LoadBalancer
        run: |
          echo "Waiting for AWS LoadBalancer..."

          for i in {1..30}; do
            ADDRESS=$(kubectl get service frontend \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')

            if [ -n "$ADDRESS" ]; then
              echo "LoadBalancer hostname: $ADDRESS"
              break
            fi

            echo "LoadBalancer still pending... attempt $i/30"
            sleep 10
          done

          if [ -z "$ADDRESS" ]; then
            echo "LoadBalancer hostname was not assigned."
            kubectl describe service frontend
            exit 1
          fi

      - name: Show frontend URL
        run: |
          ADDRESS=$(kubectl get service frontend \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')

          echo ""
          echo "=============================================="
          echo "FRONTEND APPLICATION"
          echo "=============================================="
          echo "http://$ADDRESS"
          echo "=============================================="