name: Backend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'starter/backend/**'
      - '.github/workflows/backend-cd.yaml'
  workflow_dispatch:

jobs:

  # =========================
  # LINT
  # =========================
  lint:
    name: Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Pipenv
        run: pip install pipenv

      - name: Install dependencies
        run: pipenv install --dev

      - name: Run lint
        run: pipenv run lint


  # =========================
  # TEST
  # =========================
  test:
    name: Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Pipenv
        run: pip install pipenv

      - name: Install dependencies
        run: pipenv install --dev

      - name: Run tests
        run: pipenv run test


  # =========================
  # BUILD + PUSH TO ECR
  # =========================
  build:
    name: Build
    runs-on: ubuntu-latest

    needs:
      - lint
      - test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        working-directory: starter/backend
        run: |
          docker build \
            --tag mp-backend:${{ github.sha }} .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password \
            --region "${{ secrets.AWS_REGION }}" \
            | docker login \
            --username AWS \
            --password-stdin "${{ secrets.BACKEND_ECR_REPO }}"

      - name: Tag image
        run: |
          docker tag \
            mp-backend:${{ github.sha }} \
            ${{ secrets.BACKEND_ECR_REPO }}:${{ github.sha }}

      - name: Push image to ECR
        run: |
          docker push \
            ${{ secrets.BACKEND_ECR_REPO }}:${{ github.sha }}


  # =========================
  # DEPLOY TO EKS
  # =========================
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name "${{ secrets.EKS_CLUSTER_NAME }}" \
            --region "${{ secrets.AWS_REGION }}"

      - name: Verify Kubernetes access
        run: |
          kubectl get nodes

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Set backend image
        working-directory: starter/backend/k8s
        run: |
          kustomize edit set image \
            backend=${{ secrets.BACKEND_ECR_REPO }}:${{ github.sha }}

      - name: Deploy backend
        working-directory: starter/backend/k8s
        run: |
          kustomize build | kubectl apply -f -


      # =========================
      # WAIT FOR ROLLOUT
      # =========================
      - name: Wait for backend rollout
        run: |
          echo "===== WAITING FOR BACKEND ====="

          kubectl rollout status deployment/backend --timeout=180s


      # =========================
      # BACKEND DIAGNOSTICS
      # =========================
      - name: Backend diagnostics
        if: always()
        run: |

          echo "=============================================="
          echo "BACKEND DEPLOYMENT"
          echo "=============================================="

          kubectl get deployment backend -o wide || true


          echo ""
          echo "=============================================="
          echo "BACKEND PODS"
          echo "=============================================="

          kubectl get pods \
            -l app=backend \
            -o wide || true


          echo ""
          echo "=============================================="
          echo "BACKEND POD STATUS"
          echo "=============================================="

          kubectl get pods \
            -l app=backend \
            -o jsonpath='{range .items[*]}{.metadata.name}{" : "}{.status.phase}{"\n"}{end}' || true


          echo ""
          echo "=============================================="
          echo "BACKEND LOGS"
          echo "=============================================="

          POD=$(kubectl get pods \
            -l app=backend \
            -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)

          if [ -n "$POD" ]; then
            echo "Pod: $POD"
            echo ""
            kubectl logs "$POD" \
              --all-containers=true \
              --tail=200 || true

            echo ""
            echo "===== PREVIOUS CONTAINER LOGS ====="

            kubectl logs "$POD" \
              --all-containers=true \
              --previous \
              --tail=100 || true
          else
            echo "No backend pod found."
          fi


          echo ""
          echo "=============================================="
          echo "BACKEND SERVICE"
          echo "=============================================="

          kubectl get service backend -o wide || true


          echo ""
          echo "=============================================="
          echo "BACKEND ENDPOINTS"
          echo "=============================================="

          kubectl get endpoints backend -o wide || true


          echo ""
          echo "=============================================="
          echo "BACKEND ENDPOINT SLICES"
          echo "=============================================="

          kubectl get endpointslice \
            -l kubernetes.io/service-name=backend \
            -o wide || true


          echo ""
          echo "=============================================="
          echo "BACKEND EVENTS"
          echo "=============================================="

          kubectl get events \
            --sort-by=.lastTimestamp \
            | tail -50 || true


          echo ""
          echo "=============================================="
          echo "BACKEND DEPLOYMENT DESCRIPTION"
          echo "=============================================="

          kubectl describe deployment backend || true


          echo ""
          echo "=============================================="
          echo "BACKEND POD DESCRIPTION"
          echo "=============================================="

          if [ -n "$POD" ]; then
            kubectl describe pod "$POD" || true
          fi


      # =========================
      # SHOW BACKEND URL
      # =========================
      - name: Show backend service
        if: always()
        run: |

          echo ""
          echo "=============================================="
          echo "BACKEND SERVICE"
          echo "=============================================="

          kubectl get service backend -o wide || true

          echo ""
          echo "=============================================="
          echo "BACKEND LOAD BALANCER"
          echo "=============================================="

          ADDRESS=$(kubectl get service backend \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)

          if [ -n "$ADDRESS" ]; then
            echo "Backend URL:"
            echo "http://$ADDRESS/movies/"
          else
            echo "LoadBalancer hostname not available yet."
          fi