name: Backend Continuous Deployment

on:
  workflow_dispatch:

jobs:

  # ============================================================
  # LINT
  # ============================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Pipenv
        run: pip install pipenv

      - name: Install dependencies
        run: pipenv install --dev

      - name: Run lint
        run: pipenv run lint


  # ============================================================
  # TEST
  # ============================================================
  test:
    name: Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Pipenv
        run: pip install pipenv

      - name: Install dependencies
        run: pipenv install --dev

      - name: Run tests
        run: pipenv run test


  # ============================================================
  # BUILD + PUSH TO ECR
  # ============================================================
  build:
    name: Build
    runs-on: ubuntu-latest

    needs:
      - lint
      - test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        working-directory: starter/backend
        run: |
          docker build \
            --tag mp-backend:${{ github.sha }} .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password \
            --region "${{ secrets.AWS_REGION }}" |
          docker login \
            --username AWS \
            --password-stdin "${{ secrets.BACKEND_ECR_REPO }}"

      - name: Tag image
        run: |
          docker tag \
            mp-backend:${{ github.sha }} \
            "${{ secrets.BACKEND_ECR_REPO }}:${{ github.sha }}"

      - name: Push image to ECR
        run: |
          docker push \
            "${{ secrets.BACKEND_ECR_REPO }}:${{ github.sha }}"


  # ============================================================
  # DEPLOY TO EKS
  # ============================================================
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name "${{ secrets.EKS_CLUSTER_NAME }}" \
            --region "${{ secrets.AWS_REGION }}"

      - name: Verify Kubernetes access
        run: |
          kubectl get nodes


      # ========================================================
      # KUSTOMIZE
      # ========================================================
      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2


      # ========================================================
      # SHOW CURRENT BACKEND
      # ========================================================
      - name: Check current backend
        run: |
          echo "=============================================="
          echo "CURRENT BACKEND DEPLOYMENT"
          echo "=============================================="

          kubectl get deployment backend -o wide || true

          echo ""
          echo "=============================================="
          echo "CURRENT BACKEND PODS"
          echo "=============================================="

          kubectl get pods \
            -l app=backend \
            -o wide || true

          echo ""
          echo "=============================================="
          echo "CURRENT BACKEND SERVICE"
          echo "=============================================="

          kubectl get service backend \
            -o wide || true


      # ========================================================
      # SET BACKEND IMAGE
      # ========================================================
      - name: Set backend image
        working-directory: starter/backend/k8s
        run: |
          kustomize edit set image \
            backend="${{ secrets.BACKEND_ECR_REPO }}:${{ github.sha }}"


      # ========================================================
      # BUILD KUSTOMIZE MANIFESTS
      # ========================================================
      - name: Build backend manifests
        working-directory: starter/backend/k8s
        run: |
          kustomize build .


      # ========================================================
      # DEPLOY BACKEND
      # ========================================================
      - name: Deploy backend
        working-directory: starter/backend/k8s
        run: |
          kustomize build . | kubectl apply -f -


      # ========================================================
      # SHOW DEPLOYMENT
      # ========================================================
      - name: Show backend deployment
        run: |
          echo "=============================================="
          echo "BACKEND DEPLOYMENT"
          echo "=============================================="

          kubectl get deployment backend \
            -o wide


      # ========================================================
      # SHOW PODS
      # ========================================================
      - name: Show backend pods
        run: |
          echo "=============================================="
          echo "BACKEND PODS"
          echo "=============================================="

          kubectl get pods \
            -l app=backend \
            -o wide


      # ========================================================
      # SHOW SERVICE
      # ========================================================
      - name: Show backend service
        run: |
          echo "=============================================="
          echo "BACKEND SERVICE"
          echo "=============================================="

          kubectl get service backend \
            -o wide


      # ========================================================
      # WAIT FOR ROLLOUT
      # ========================================================
      - name: Wait for backend rollout
        run: |
          echo "=============================================="
          echo "WAITING FOR BACKEND ROLLOUT"
          echo "=============================================="

          if ! kubectl rollout status \
            deployment/backend \
            --timeout=180s; then

            echo ""
            echo "=============================================="
            echo "BACKEND DEPLOYMENT FAILED"
            echo "=============================================="

            echo ""
            echo "===== DEPLOYMENT ====="
            kubectl get deployment backend \
              -o wide || true

            echo ""
            echo "===== PODS ====="
            kubectl get pods \
              -l app=backend \
              -o wide || true

            echo ""
            echo "===== POD DESCRIPTION ====="
            kubectl describe pods \
              -l app=backend || true

            echo ""
            echo "===== EVENTS ====="
            kubectl get events \
              --sort-by=.lastTimestamp |
              tail -50 || true

            exit 1
          fi

          echo ""
          echo "Backend rollout completed successfully."


      # ========================================================
      # BACKEND DIAGNOSTICS
      # ========================================================
      - name: Backend diagnostics
        if: always()
        run: |

          echo "=============================================="
          echo "BACKEND DEPLOYMENT"
          echo "=============================================="

          kubectl get deployment backend \
            -o wide || true


          echo ""
          echo "=============================================="
          echo "BACKEND PODS"
          echo "=============================================="

          kubectl get pods \
            -l app=backend \
            -o wide || true


          echo ""
          echo "=============================================="
          echo "BACKEND POD STATUS"
          echo "=============================================="

          kubectl get pods \
            -l app=backend \
            -o jsonpath='{range .items[*]}{.metadata.name}{" : "}{.status.phase}{" : Ready="}{range .status.conditions[?(@.type=="Ready")]}{.status}{end}{"\n"}{end}' \
            || true


          echo ""
          echo "=============================================="
          echo "BACKEND SERVICE"
          echo "=============================================="

          kubectl get service backend \
            -o wide || true


          echo ""
          echo "=============================================="
          echo "BACKEND ENDPOINTS"
          echo "=============================================="

          kubectl get endpoints backend \
            -o wide || true


          echo ""
          echo "=============================================="
          echo "BACKEND ENDPOINT SLICES"
          echo "=============================================="

          kubectl get endpointslice \
            -l kubernetes.io/service-name=backend \
            -o wide || true


          echo ""
          echo "=============================================="
          echo "BACKEND EVENTS"
          echo "=============================================="

          kubectl get events \
            --sort-by=.lastTimestamp |
            tail -50 || true


          POD=$(kubectl get pods \
            -l app=backend \
            -o jsonpath='{.items[0].metadata.name}' \
            2>/dev/null || true)


          if [ -n "$POD" ]; then

            echo ""
            echo "=============================================="
            echo "BACKEND LOGS"
            echo "=============================================="

            echo "Pod: $POD"

            kubectl logs "$POD" \
              --all-containers=true \
              --tail=200 || true


            echo ""
            echo "=============================================="
            echo "PREVIOUS BACKEND LOGS"
            echo "=============================================="

            kubectl logs "$POD" \
              --all-containers=true \
              --previous \
              --tail=100 || true


            echo ""
            echo "=============================================="
            echo "BACKEND POD DESCRIPTION"
            echo "=============================================="

            kubectl describe pod "$POD" || true

          else

            echo ""
            echo "No backend pod found."

          fi


      # ========================================================
      # SHOW BACKEND URL
      # ========================================================
      - name: Show backend URL
        if: always()
        run: |

          ADDRESS=$(kubectl get service backend \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' \
            2>/dev/null || true)


          echo ""
          echo "=============================================="
          echo "BACKEND APPLICATION"
          echo "=============================================="


          if [ -n "$ADDRESS" ]; then

            echo ""
            echo "BACKEND LOAD BALANCER:"
            echo "http://$ADDRESS"

            echo ""
            echo "BACKEND MOVIES API:"
            echo "http://$ADDRESS/movies/"

            echo ""
            echo "=============================================="

          else

            echo "Backend LoadBalancer hostname not available."

            echo ""
            echo "Service details:"
            kubectl get service backend \
              -o wide || true

          fi