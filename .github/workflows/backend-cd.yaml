name: Backend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'starter/backend/**'
      - '.github/workflows/backend-cd.yaml'
  workflow_dispatch:

jobs:

  # =========================
  # LINT
  # =========================
  lint:
    name: Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Pipenv
        run: pip install pipenv

      - name: Install dependencies
        run: pipenv install --dev

      - name: Run lint
        run: pipenv run lint


  # =========================
  # TEST
  # =========================
  test:
    name: Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Pipenv
        run: pip install pipenv

      - name: Install dependencies
        run: pipenv install --dev

      - name: Run tests
        run: pipenv run test


  # =========================
  # BUILD + PUSH TO ECR
  # =========================
  build:
    name: Build
    runs-on: ubuntu-latest

    needs:
      - lint
      - test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        working-directory: starter/backend
        run: |
          docker build \
            --tag mp-backend:${{ github.sha }} .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password \
            --region "${{ secrets.AWS_REGION }}" \
            | docker login \
            --username AWS \
            --password-stdin "${{ secrets.BACKEND_ECR_REPO }}"

      - name: Tag image
        run: |
          docker tag \
            mp-backend:${{ github.sha }} \
            ${{ secrets.BACKEND_ECR_REPO }}:${{ github.sha }}

      - name: Push image to ECR
        run: |
          docker push \
            ${{ secrets.BACKEND_ECR_REPO }}:${{ github.sha }}


  # =========================
  # DEPLOY TO EKS
  # =========================
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name "${{ secrets.EKS_CLUSTER_NAME }}" \
            --region "${{ secrets.AWS_REGION }}"

      - name: Verify Kubernetes access
        run: |
          kubectl get nodes

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Set backend image
        working-directory: starter/backend/k8s
        run: |
          kustomize edit set image \
            backend=${{ secrets.BACKEND_ECR_REPO }}:${{ github.sha }}

      - name: Deploy backend
        working-directory: starter/backend/k8s
        run: |
          kustomize build | kubectl apply -f -

      # =========================
      # DEPLOYMENT CHECK
      # =========================
      - name: Check backend deployment
        run: |
          echo "===== DEPLOYMENT ====="
          kubectl get deployment backend -o wide

          echo ""
          echo "===== PODS ====="
          kubectl get pods -l app=backend -o wide

          echo ""
          echo "===== SERVICE ====="
          kubectl get service backend -o wide

      # =========================
      # ROLLOUT
      # =========================
      - name: Check backend rollout
        run: |
          echo "===== ROLLOUT STATUS ====="

          if ! kubectl rollout status deployment/backend --timeout=180s; then

            echo ""
            echo "===== DEPLOYMENT FAILED ====="
            kubectl get deployment backend -o yaml

            echo ""
            echo "===== PODS ====="
            kubectl get pods -l app=backend -o wide

            echo ""
            echo "===== POD DESCRIPTIONS ====="
            kubectl describe pods -l app=backend

            echo ""
            echo "===== RECENT EVENTS ====="
            kubectl get events \
              --sort-by=.lastTimestamp \
              | tail -50

            exit 1
          fi

      # =========================
      # BACKEND SERVICE
      # =========================
      - name: Show backend service
        run: |
          echo ""
          echo "=============================================="
          echo "BACKEND SERVICE"
          echo "=============================================="

          kubectl get service backend -o wide

          echo ""
          echo "=============================================="