name: Backend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - "starter/backend/**"
      - ".github/workflows/backend-cd.yaml"
  workflow_dispatch:

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Pipenv
        run: pip install pipenv

      - name: Install dependencies
        run: pipenv install --dev

      - name: Run lint
        run: pipenv run lint


  test:
    name: Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Pipenv
        run: pip install pipenv

      - name: Install dependencies
        run: pipenv install --dev

      - name: Run tests
        run: pipenv run test


  build:
    name: Build
    runs-on: ubuntu-latest

    needs:
      - lint
      - test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        working-directory: starter/backend
        run: docker build --tag mp-backend:${{ github.sha }} .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "${{ secrets.AWS_REGION }}" |
          docker login --username AWS --password-stdin "${{ secrets.BACKEND_ECR_REPO }}"

      - name: Tag image
        run: docker tag mp-backend:${{ github.sha }} "${{ secrets.BACKEND_ECR_REPO }}:${{ github.sha }}"

      - name: Push image to ECR
        run: docker push "${{ secrets.BACKEND_ECR_REPO }}:${{ github.sha }}"


  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name "${{ secrets.EKS_CLUSTER_NAME }}" \
            --region "${{ secrets.AWS_REGION }}"

      - name: Verify Kubernetes access
        run: kubectl get nodes

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Set backend image
        working-directory: starter/backend/k8s
        run: kustomize edit set image backend="${{ secrets.BACKEND_ECR_REPO }}:${{ github.sha }}"

      - name: Deploy backend
        working-directory: starter/backend/k8s
        run: kustomize build | kubectl apply -f -

      - name: Show backend deployment
        run: kubectl get deployment backend -o wide

      - name: Show backend pods
        run: kubectl get pods -l app=backend -o wide

      - name: Show backend service
        run: kubectl get service backend -o wide

      - name: Wait for backend rollout
        run: |
          if ! kubectl rollout status deployment/backend --timeout=180s; then
            echo "===== DEPLOYMENT FAILED ====="
            kubectl get deployment backend -o wide || true
            kubectl get pods -l app=backend -o wide || true
            kubectl describe pods -l app=backend || true
            kubectl get events --sort-by=.lastTimestamp | tail -50 || true
            exit 1
          fi

      - name: Backend diagnostics
        if: always()
        run: |
          echo "===== BACKEND DEPLOYMENT ====="
          kubectl get deployment backend -o wide || true

          echo "===== BACKEND PODS ====="
          kubectl get pods -l app=backend -o wide || true

          echo "===== BACKEND SERVICE ====="
          kubectl get service backend -o wide || true

          echo "===== BACKEND ENDPOINTS ====="
          kubectl get endpoints backend -o wide || true

          echo "===== BACKEND LOGS ====="

          POD=$(kubectl get pods -l app=backend -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)

          if [ -n "$POD" ]; then
            echo "Pod: $POD"
            kubectl logs "$POD" --all-containers=true --tail=200 || true

            echo "===== PREVIOUS LOGS ====="
            kubectl logs "$POD" --all-containers=true --previous --tail=100 || true

            echo "===== POD DESCRIPTION ====="
            kubectl describe pod "$POD" || true
          else
            echo "No backend pod found."
          fi

          echo "===== RECENT EVENTS ====="
          kubectl get events --sort-by=.lastTimestamp | tail -50 || true

      - name: Show backend URL
        if: always()
        run: |
          ADDRESS=$(kubectl get service backend -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)

          if [ -n "$ADDRESS" ]; then
            echo "=============================================="
            echo "BACKEND URL"
            echo "=============================================="
            echo "http://$ADDRESS/movies/"
            echo "=============================================="
          else
            echo "Backend LoadBalancer hostname not available."
          fi